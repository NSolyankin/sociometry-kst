name: Keep services alive

on:
  schedule:
    # Каждые 3 дня в 13:00 UTC = 21:00 по Иркутску (UTC+8)
    # Cron не умеет "каждые 3 дня" напрямую, поэтому перечисляем дни месяца:
    # 1, 4, 7, 10, 13, 16, 19, 22, 25, 28 числа каждого месяца
    # Запас от лимита Supabase 7 дней: минимум 3 дня, что даёт двойной резерв
    # при возможных сбоях GitHub Actions или прокси.
    - cron: '0 13 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel proxy healthcheck
        run: |
          echo "[1/4] Pinging Vercel proxy local healthcheck..."
          curl --fail --show-error --silent --max-time 30 \
            https://probe-vercel-kappa.vercel.app/healthcheck
          echo ""
          echo "Vercel proxy alive"

      - name: Ping Deno proxy healthcheck
        run: |
          echo "[2/4] Pinging Deno proxy local healthcheck..."
          curl --fail --show-error --silent --max-time 30 \
            https://probe-deno.nsolyankin.deno.net/healthcheck
          echo ""
          echo "Deno proxy alive"

      - name: Wake up Supabase database via Vercel proxy (real SELECT query)
        env:
          SUPABASE_KEY: 'sb_publishable_k_Cy89H33YGxyrZn-tsJBg__b0feVAY'
        run: |
          echo "[3/4] Waking up Supabase database via Vercel proxy..."
          echo "Real SELECT query to 'groups' table (passes through PostgreSQL)"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "https://probe-vercel-kappa.vercel.app/rest/v1/groups?select=id&limit=1")
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt
          echo ""
          # Ожидаем HTTP 200 и JSON-массив (даже пустой []).
          # 200 + массив означает что PostgreSQL реально получил SELECT-запрос,
          # обработал его и вернул данные. Это и есть "database activity" с точки
          # зрения Supabase, что сбрасывает таймер 7 дней.
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Expected HTTP 200, got $HTTP_CODE"
            exit 1
          fi
          # Проверяем что ответ начинается с [ (JSON-массив)
          if ! head -c 1 /tmp/response.txt | grep -q '\['; then
            echo "ERROR: Response is not a JSON array. PostgreSQL did not respond."
            exit 1
          fi
          echo "Supabase PostgreSQL responded with data - activity counted"

      - name: Wake up Supabase database via Deno proxy (real SELECT query)
        env:
          SUPABASE_KEY: 'sb_publishable_k_Cy89H33YGxyrZn-tsJBg__b0feVAY'
        run: |
          echo "[4/4] Waking up Supabase database via Deno proxy..."
          echo "Real SELECT query to 'groups' table (passes through PostgreSQL)"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "https://probe-deno.nsolyankin.deno.net/rest/v1/groups?select=id&limit=1")
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Expected HTTP 200, got $HTTP_CODE"
            exit 1
          fi
          if ! head -c 1 /tmp/response.txt | grep -q '\['; then
            echo "ERROR: Response is not a JSON array. PostgreSQL did not respond."
            exit 1
          fi
          echo "Supabase PostgreSQL responded with data via Deno proxy - activity counted"
