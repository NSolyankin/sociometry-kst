name: Keep services alive

on:
  schedule:
    # Каждый день в 13:00 UTC = 21:00 по Иркутску (UTC+8).
    # Ежедневный пинг дает активность каждый день недели. За неделю это
    # порядка 14 INSERT-запросов (по одному через каждый из двух прокси),
    # что попадает в коридор 10-20 запросов в неделю, который поддержка
    # Supabase назвала достаточным для предотвращения паузы.
    # Прошлое расписание (раз в 3 дня) давало лишь 4-6 запросов в неделю
    # с пропусками по 2 дня - этого не хватало, проект ставили на паузу.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel proxy healthcheck
        run: |
          echo "[1/4] Pinging Vercel proxy local healthcheck..."
          curl --fail --show-error --silent --max-time 30 \
            https://probe-vercel-kappa.vercel.app/healthcheck
          echo ""
          echo "Vercel proxy alive"

      - name: Ping Deno proxy healthcheck
        run: |
          echo "[2/4] Pinging Deno proxy local healthcheck..."
          curl --fail --show-error --silent --max-time 30 \
            https://probe-deno.nsolyankin.deno.net/healthcheck
          echo ""
          echo "Deno proxy alive"

      - name: Wake up Supabase database via Vercel proxy (real INSERT)
        env:
          SUPABASE_KEY: 'sb_publishable_k_Cy89H33YGxyrZn-tsJBg__b0feVAY'
        run: |
          echo "[3/4] Waking up Supabase database via Vercel proxy..."
          echo "Real INSERT into 'keep_alive_log' table (writes a row in PostgreSQL)"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            "https://probe-vercel-kappa.vercel.app/rest/v1/keep_alive_log")
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt
          echo ""
          # Ожидаем HTTP 201 (Created). Это означает что PostgreSQL реально
          # ВСТАВИЛ строку в таблицу - запись гарантированно доходит до базы
          # и засчитывается как database activity. При ежедневном запуске
          # таких записей набирается достаточно для сброса таймера 7 дней.
          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "ERROR: Expected HTTP 201 (Created), got $HTTP_CODE"
            exit 1
          fi
          echo "Supabase PostgreSQL inserted a row - activity counted"

      - name: Wake up Supabase database via Deno proxy (real INSERT)
        env:
          SUPABASE_KEY: 'sb_publishable_k_Cy89H33YGxyrZn-tsJBg__b0feVAY'
        run: |
          echo "[4/4] Waking up Supabase database via Deno proxy..."
          echo "Real INSERT into 'keep_alive_log' table (writes a row in PostgreSQL)"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' \
            "https://probe-deno.nsolyankin.deno.net/rest/v1/keep_alive_log")
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "ERROR: Expected HTTP 201 (Created), got $HTTP_CODE"
            exit 1
          fi
          echo "Supabase PostgreSQL inserted a row via Deno proxy - activity counted"
